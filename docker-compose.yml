version: "3.8"

services:
  planilha-forex:
    image: nginx:alpine
    configs:
      - source: planilha_html
        target: /usr/share/nginx/html/index.html
    networks:
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.planilha-forex.rule=Host(`planilha.hubnexusai.com`)
        - traefik.http.routers.planilha-forex.entrypoints=websecure
        - traefik.http.services.planilha-forex.loadbalancer.server.port=80
        - traefik.http.routers.planilha-forex.service=planilha-forex
        - traefik.http.routers.planilha-forex.tls.certresolver=le

configs:
  planilha_html:
    file: ./Planilha_code_pro.html

networks:
  traefik_public:
    external: true
    name: traefik_public